name: LaunchDesk Android APK

on:
  push:
    branches: [feat/launchdesk-android-mobile]
  pull_request:
    branches: [main, feat/pixel-perfect-launchdesk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v67
        with:
          channel: stable
          cache: true
      - name: Verify Android SDK
        run: flutter doctor -v
      - name: Dependencies
        run: flutter pub get
      - name: Generate missing Android Flutter scaffolding
        run: flutter create --platforms=android --org com.draevix .
      - name: Check native bridge was preserved
        run: |
          grep -q 'launchdesk/mobile' android/app/src/main/kotlin/com/draevix/launchdesk/MainActivity.kt
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
      - name: Analyze mobile sources
        run: flutter analyze --yes-fatal-infos lib/main_mobile.dart lib/mobile lib/core/database/database_helper.dart lib/core/services/launcher_service.dart
      - name: Build Android release APK
        run: flutter build apk --release --target lib/main_mobile.dart
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: if doesnt work skip to 7784558525522552225424255q3535456^3
          name: LaunchDesk-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
