name: 67 New Wallahi Bro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: launchdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build LaunchDesk Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Regenerate Windows build files
        run: flutter create --platforms=windows .
      
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows executable
        run: flutter build windows --release --verbose
        
      - name: Include WebView2Loader.dll in Windows deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deploy = Join-Path $PWD 'build/windows/x64/run'
          $target = Join-Path $deploy 'WebView2Loader.dll'
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            # Flutter's plugin build can leave the loader in runner/Release or
            # the WebView plugin output instead of the CMake install directory.
            $root = Join-Path $PWD 'build/windows/x64'
            $candidates = @(Get-ChildItem -LiteralPath $root -Filter 'WebView2Loader.dll' -File -Recurse |
              Where-Object { $_.FullName -ne $target } |
              Sort-Object @{ Expression = { if ($_.FullName -match 'runner[\\/]Release') { 0 } elseif ($_.FullName -match 'Release') { 1 } else { 2 } } }, FullName)
            if ($candidates.Count -eq 0) {
              throw "WebView2Loader.dll was not generated by the Windows plugin build. Refusing to publish a broken installer."
            }
            Copy-Item -LiteralPath $candidates[0].FullName -Destination $target -Force
            Write-Host "Bundled WebView2 loader from: $($candidates[0].FullName)"
          }
          if ((Get-Item -LiteralPath $target).Length -lt 10000) {
            throw "WebView2Loader.dll is unexpectedly small or invalid."
          }
          Write-Host "Verified WebView2Loader.dll in deployment directory."

      - name: Verify and package complete Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Flutter's CMake INSTALL target places the complete deployable app
          # in build/windows/x64/run, NOT runner/Release.
          $release = Join-Path $PWD 'build/windows/x64/run'
          $required = @(
            'launchdesk.exe',
            'flutter_windows.dll',
            'WebView2Loader.dll',
            'data/app.so',
            'data/flutter_assets/AssetManifest.bin',
            'data/icudtl.dat'
          )
          foreach ($item in $required) {
            $target = Join-Path $release $item
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Missing required Windows release file: $target"
            }
          }
          $dlls = @(Get-ChildItem -LiteralPath $release -Filter '*.dll' -File)
          if ($dlls.Count -lt 2) {
            throw "Incomplete Windows release: expected Flutter and plugin DLLs."
          }
          $size = (Get-ChildItem -LiteralPath $release -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          if ($size -lt 10000000) {
            throw "Release is unexpectedly small ($size bytes); refusing to upload."
          }
          Write-Host "Packaging complete Windows deployment: $release"
          Get-ChildItem -LiteralPath $release | Select-Object Name, Length
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath launchdesk-windows.zip -Force
          $zip = Get-Item -LiteralPath launchdesk-windows.zip
          if ($zip.Length -lt 1000000) {
            throw "Windows ZIP is unexpectedly small ($($zip.Length) bytes)."
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchdesk-windows-app
          path: launchdesk-windows.zip
          if-no-files-found: error

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build LaunchDesk Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler was not installed: $compiler"
          }
          $source = Join-Path $PWD 'build/windows/x64/run'
          $output = Join-Path $PWD 'installer-output'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $compiler "/DAppSource=$source" "/O$output" 'installer/LaunchDesk.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed: $LASTEXITCODE" }
          $setup = Join-Path $output 'LaunchDesk-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Expected LaunchDesk-Setup.exe was not generated."
          }
          if ((Get-Item $setup).Length -lt 1000000) {
            throw "Installer is unexpectedly small."
          }
          Write-Host "Installer created: $setup"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LaunchDesk-Windows-Installer
          path: installer-output/LaunchDesk-Setup.exe
          if-no-files-found: error
