name: 67 New Wallahi Bro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_windows:
    name: Build LaunchDesk Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Regenerate Windows build files
        run: flutter create --platforms=windows .
      
      - name: Apply custom WinLaunch Windows icon
        shell: pwsh
        run: |
          $customIcon = 'windows/runner/resources/winlaunch.ico'
          $runnerIcon = 'windows/runner/resources/app_icon.ico'
          $runnerRc = 'windows/runner/Runner.rc'
          if (-not (Test-Path $customIcon)) { throw "Missing custom WinLaunch icon: $customIcon" }
          Copy-Item $customIcon $runnerIcon -Force
          if (-not (Test-Path $runnerRc)) { throw "Missing Windows resource definition: $runnerRc" }
          $rc = Get-Content $runnerRc -Raw
          if ($rc -notmatch 'app_icon\\.ico') { throw "Expected app_icon.ico reference not found in Runner.rc" }

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Windows executable
        run: flutter build windows --release --verbose
        
      - name: Package Release to Zip
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/run'
          if (-not (Test-Path "$bundle/launchdesk.exe")) { throw 'Missing bundled launchdesk.exe' }
          if (-not (Test-Path "$bundle/flutter_windows.dll")) { throw 'Missing Flutter runtime DLL' }
          if (-not (Test-Path "$bundle/data/flutter_assets")) { throw 'Missing Flutter assets' }
          $plugins = @('battery_plus_plugin.dll', 'connectivity_plus_plugin.dll', 'file_selector_windows_plugin.dll', 'hotkey_manager_windows_plugin.dll')
          foreach ($plugin in $plugins) {
            if (-not (Test-Path (Join-Path $bundle $plugin))) { throw "Missing bundled plugin: $plugin" }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath launchdesk-windows.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchdesk-windows-app
          path: launchdesk-windows.zip
