name: 67 New Wallahi Bro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_windows:
    name: Build LaunchDesk Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Regenerate Windows build files
        run: flutter create --platforms=windows .
      
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows executable
        run: flutter build windows --release --verbose
        
      - name: Package Release to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath launchdesk-windows.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchdesk-windows-app
          path: launchdesk-windows.zip
